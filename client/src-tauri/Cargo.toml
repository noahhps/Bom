[package]
name = "bom"
version = "0.1.0"
description = "Bom — a personal assistant on your own hardware"
authors = ["Noah Stivers"]
edition = "2021"
rust-version = "1.77"

# The binary is a thin wrapper around the library so the same code can be
# built for desktop here and, if the Windows client follows, reused there
# without a second copy of the setup.
[lib]
name = "bom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is the whole reason this is a desktop app rather than a bookmark.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
# Spawns and supervises the Python server as a sidecar. Also what a future
# "open the data folder" menu item would use.
tauri-plugin-shell = "2"
# QuickView's hotkey. A shortcut that works while another app is focused is the
# one thing a webview can never do for itself, and the whole point of the panel.
tauri-plugin-global-shortcut = "2"
# Remembers where QuickView was left. A panel you can move is only worth having
# if it stays moved -- otherwise every summon undoes the last decision about it.
tauri-plugin-window-state = "2"
# The frosted ground behind QuickView. CSS `backdrop-filter` blurs what is
# behind an element *within the page*; blurring the desktop behind the window
# is a native material and has to be applied to the window itself.
window-vibrancy = "0.6"
# bom:// links: how a sign-in link from an email reaches this app rather than
# the browser it was opened in.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon of a dev run, which no bundle supplies.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# A release build of a webview shell spends almost all its size on debug
# symbols and unoptimised glue. These are the standard Tauri release settings.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
